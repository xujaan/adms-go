<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMS - {{.Title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; }
        .card { background-color: #16213e; border-color: #0f3460; }
        .table { --bs-table-bg: transparent; }
        .navbar { background-color: #0f3460 !important; }
        .page-link { background-color: #16213e; border-color: #0f3460; }
        .page-link:hover { background-color: #0f3460; }
        pre { color: #e0e0e0; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">ADMS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {{if eq .Active "devices"}}active{{end}}" href="/devices">Devices</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{if eq .Active "attendance"}}active{{end}}" href="/attendance">Attendance</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{if eq .Active "devices-log"}}active{{end}}" href="/devices-log">Device Log</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{if eq .Active "finger-log"}}active{{end}}" href="/finger-log">Finger Log</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {{template "content" .}}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
</body>
</html>
