<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background-color: #16213e;
            border: 1px solid #0f3460;
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card card mx-auto">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">ADMS</h3>
                    <small class="text-muted">Attendance Device Management</small>
                </div>

                {{if .Error}}
                <div class="alert alert-danger py-2 small">Invalid username or password.</div>
                {{end}}

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label small">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
