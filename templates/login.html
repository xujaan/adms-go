<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMS - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👆</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { color-scheme: light dark; }
        [data-bs-theme="light"] {
            --app-bg: #f8fafc;
            --app-card: #ffffff;
            --app-border: #e2e8f0;
        }
        [data-bs-theme="dark"] {
            --app-bg: #0f172a;
            --app-card: #1e293b;
            --app-border: #334155;
        }
        body {
            background-color: var(--app-bg);
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background-color: var(--app-card);
            border: 1px solid var(--app-border);
            max-width: 400px;
            width: 100%;
        }
        .btn {
            border: none;
            border-radius: 8px;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card card mx-auto">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">ADMS</h3>
                    <small class="text-muted">Attendance Device Management</small>
                </div>

                {{if .Error}}
                <div class="alert alert-danger py-2 small">Invalid username or password.</div>
                {{end}}

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label small">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        (function(){var t=localStorage.getItem('adms-theme')||'dark';document.documentElement.setAttribute('data-bs-theme',t)})();
    </script>
</body>
</html>
