{{define "webhooks"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMS - Webhooks</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👆</text></svg>">
    <script>document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('adms-theme')||'dark')</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/custom.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">ADMS</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/devices">Devices</a></li>
                    <li class="nav-item"><a class="nav-link" href="/attendance">Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="/devices-log">Device Log</a></li>
                    <li class="nav-item"><a class="nav-link" href="/finger-log">Finger Log</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/webhooks">Webhooks</a></li>
                    <li class="nav-item"><button class="theme-toggle nav-link" onclick="toggleTheme()" title="Toggle theme" style="border:none;background:none;cursor:pointer">🌙</button></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Webhooks</h4>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ Add Webhook</button>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover table-sm mb-0">
                    <thead>
                        <tr><th>#</th><th>Device</th><th>Name</th><th>URL</th><th>Event</th><th>Active</th><th></th></tr>
                    </thead>
                    <tbody id="webhook-tbody">
                        <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Webhook</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2"><label class="form-label small">Device SN <span class="text-muted">(empty=global)</span></label><input id="wh-device" class="form-control form-control-sm" placeholder="e.g. ABC123 or leave blank"></div>
                    <div class="mb-2"><label class="form-label small">Name</label><input id="wh-name" class="form-control form-control-sm" placeholder="e.g. Sync Prod"></div>
                    <div class="mb-2"><label class="form-label small">URL</label><input id="wh-url" class="form-control form-control-sm" placeholder="https://..."></div>
                    <div class="mb-2"><label class="form-label small">Custom Headers <span class="text-muted">(key:value, one per line)</span></label><textarea id="wh-headers" class="form-control form-control-sm" rows="2" placeholder="Authorization: Bearer xxx"></textarea></div>
                    <div class="mb-2"><label class="form-label small">Event</label>
                        <select id="wh-event" class="form-select form-select-sm">
                            <option value="attendance">attendance</option>
                            <option value="device_register">device_register</option>
                            <option value="device_online">device_online</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary btn-sm" onclick="addWebhook()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>
        function loadWebhooks() {
            $.get('/api/webhooks', function(data) {
                var rows = '';
                if (!data.webhooks || data.webhooks.length === 0) {
                    rows = '<tr><td colspan="7" class="text-center text-muted py-4">No webhooks.</td></tr>';
                } else {
                    data.webhooks.forEach(function(w) {
                        rows += '<tr>' +
                            '<td>' + w.id + '</td>' +
                            '<td><code>' + (w.device_sn || 'ALL') + '</code></td>' +
                            '<td>' + w.name + '</td>' +
                            '<td><code class="small">' + w.url + '</code></td>' +
                            '<td><span class="badge bg-info">' + w.event + '</span></td>' +
                            '<td>' + (w.is_active ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>') + '</td>' +
                            '<td><button class="btn btn-danger btn-sm" onclick="delWebhook(' + w.id + ')">×</button></td>' +
                            '</tr>';
                    });
                }
                $('#webhook-tbody').html(rows);
            });
        }

        function addWebhook() {
            $.ajax({
                url: '/api/webhooks',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    device_sn: $('#wh-device').val(),
                    name: $('#wh-name').val(),
                    url: $('#wh-url').val(),
                    event: $('#wh-event').val(),
                    headers: $('#wh-headers').val()
                }),
                success: function() {
                    $('#addModal').modal('hide');
                    $('#wh-device,#wh-name,#wh-url,#wh-headers').val('');
                    loadWebhooks();
                },
                error: function(xhr) {
                    alert('Error: ' + xhr.responseText);
                }
            });
        }

        function delWebhook(id) {
            if (!confirm('Delete webhook #' + id + '?')) return;
            $.ajax({url: '/api/webhooks/' + id, method: 'DELETE', success: loadWebhooks});
        }

        $(loadWebhooks);
    </script>
    <script src="/static/theme.js"></script>
</body>
</html>
{{end}}
